<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quorum verdict seal — full ring">
  <title>Quorum — Verdict Seal variant (closed ring with three advocate arcs)</title>
  <rect width="64" height="64" rx="12" fill="#0d0f15"/>
  <!-- thin rim (the chamber) -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#a7a29b" stroke-width="1.1" opacity="0.5"/>
  <!-- three advocate arcs orbiting the core (gold Bull, azure Bear, argent Risk) -->
  <path d="M32 14 A18 18 0 0 1 47.6 23" fill="none" stroke="#e8aa4e" stroke-width="3" stroke-linecap="round"/>
  <path d="M47.6 41 A18 18 0 0 1 32 50" fill="none" stroke="#a7a29b" stroke-width="3" stroke-linecap="round"/>
  <path d="M16.4 41 A18 18 0 0 1 16.4 23" fill="none" stroke="#60a8dc" stroke-width="3" stroke-linecap="round"/>
  <!-- conviction ring arc (crimson authority) -->
  <path d="M32 19 A13 13 0 1 1 20.8 38.5" fill="none" stroke="#cd4845" stroke-width="3.4" stroke-linecap="round"/>
  <!-- ruling core -->
  <circle cx="32" cy="32" r="5.4" fill="#cd4845"/>
</svg>
