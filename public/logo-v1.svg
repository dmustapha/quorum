<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quorum verdict seal">
  <title>Quorum — the Verdict Seal (logomark): three voices argue, a Judge rules, dissent kept</title>
  <rect width="64" height="64" rx="12" fill="#0d0f15"/>
  <!-- conviction ring (the Judge / ruling / authority — Lac crimson), swept ~300deg -->
  <path d="M32 10 A22 22 0 1 1 13.3 43" fill="none" stroke="#cd4845" stroke-width="4.2" stroke-linecap="round"/>
  <!-- threshold bar notch on the ring (the conviction bar) -->
  <line x1="49.5" y1="19.5" x2="54" y2="15" stroke="#a7a29b" stroke-width="2.4" stroke-linecap="round"/>
  <!-- three advocate strokes converging to the core -->
  <path d="M43 20 Q36.5 27 32 32" fill="none" stroke="#e8aa4e" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M18.5 40 Q26 36 32 32" fill="none" stroke="#60a8dc" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M42 45 Q36 38 32 32" fill="none" stroke="#a7a29b" stroke-width="2.8" stroke-linecap="round"/>
  <!-- the ruling core (stamped) -->
  <circle cx="32" cy="32" r="6.4" fill="#cd4845"/>
  <!-- dissent kept on the record (azure dashed thread) -->
  <path d="M22 22 Q27 27 32 32" fill="none" stroke="#60a8dc" stroke-width="1.6" stroke-dasharray="2.4 3" stroke-linecap="round" opacity="0.72"/>
</svg>
