<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Quorum logomark">
  <title>Quorum — three voices, one verdict</title>
  <rect width="64" height="64" rx="4" fill="#0b0d10"/>
  <!-- three counsel ticks (bull / bear / risk) converging left→right into one verdict bar -->
  <rect x="12" y="18" width="18" height="3" rx="1.5" fill="#00e08a"/>
  <rect x="12" y="30.5" width="18" height="3" rx="1.5" fill="#ff4d4d"/>
  <rect x="12" y="43" width="18" height="3" rx="1.5" fill="#b6ff3c"/>
  <!-- convergence seam -->
  <path d="M30 19.5 L38 32 L30 44.5" fill="none" stroke="#5a616c" stroke-width="1.5"/>
  <!-- the single verdict bar (lime = on the record) -->
  <rect x="40" y="30.5" width="12" height="3" rx="1.5" fill="#b6ff3c"/>
</svg>
