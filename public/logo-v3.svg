<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Quorum">
  <title>Quorum — combination mark (Verdict Seal + Fraunces wordmark)</title>
  <rect width="220" height="64" rx="12" fill="#0d0f15"/>
  <!-- compact Verdict Seal -->
  <g transform="translate(10 10) scale(0.68)">
    <path d="M32 10 A22 22 0 1 1 13.3 43" fill="none" stroke="#cd4845" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M43 20 Q36.5 27 32 32" fill="none" stroke="#e8aa4e" stroke-width="3" stroke-linecap="round"/>
    <path d="M18.5 40 Q26 36 32 32" fill="none" stroke="#60a8dc" stroke-width="3" stroke-linecap="round"/>
    <path d="M42 45 Q36 38 32 32" fill="none" stroke="#a7a29b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="6.8" fill="#cd4845"/>
  </g>
  <!-- wordmark: Fraunces display serif (the heraldic voice) -->
  <text x="62" y="41" font-family="Fraunces, Georgia, serif" font-size="27" font-weight="600" letter-spacing="-0.3" fill="#eceae7">Quorum</text>
</svg>
